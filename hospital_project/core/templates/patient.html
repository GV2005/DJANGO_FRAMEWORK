{% extends 'base.html' %}

{% block content %}

<h2>Patient Records</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Disease</th>
        <th>Update</th>
        <th>Delete</th>
    </tr>

    {% for patient in patients %}
    <tr>
        <td>{{ patient.name }}</td>
        <td>{{ patient.age }}</td>
        <td>{{ patient.disease }}</td>

        <td>
        <a href="{% url 'update_patient' patient.id %}">
            Update
        </a>
        </td>
        <td>
        <a href="{% url 'delete_patient' patient.id %}">
            Delete
        </a>
        </td>

    </tr>
    {% endfor %}

</table>

{% endblock %}
