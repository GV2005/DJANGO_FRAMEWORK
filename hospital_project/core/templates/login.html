<div class="card shadow p-4">

    <h2 class="mb-4">Login</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label>Username</label>
            {{ form.username }}
        </div>

        <div class="mb-3">
            <label>Password</label>
            {{ form.password }}
        </div>

        <button type="submit" class="btn btn-primary">
            Login
        </button>

    </form>

</div>
